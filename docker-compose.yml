version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: migration_validator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: migration_validator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d migration_validator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

