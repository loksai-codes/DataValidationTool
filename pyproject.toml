[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-validator"
version = "1.0.0"
description = "Streamlit-first database validation platform with partition-based actual-value comparison and durable resume"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Engineering Team" }
]
dependencies = [
    "streamlit>=1.30.0",
    "pydantic>=2.6.0",
    "psycopg[binary]>=3.1.0",
    "boto3>=1.34.0",
    "pyathena>=3.0.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "live: Live external database tests (opt-in)",
]
